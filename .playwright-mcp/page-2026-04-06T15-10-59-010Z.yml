            - heading "HATS Import" [level=1] [ref=e115]
            - paragraph [ref=e116]: HATS is a directory structure and metadata for spatially arranging large catalog survey data. This was originally motivated by a desire to perform spatial cross-matching between surveys at large scale, but is applicable to a range of spatial analysis and algorithms.
            - generic [ref=e117]:
              - paragraph [ref=e118]: Attention 
              - paragraph [ref=e119]:
                - text: If you already have catalog in HATS format and are just looking to ingest it or analyze it, you can look instead to
                - code [ref=e120]: LSDB
                - text: ", a python tool for scalable analysis of large catalogs (e.g. querying and crossmatching ~10⁹ sources). It aims to address large-scale data processing challenges, in particular those brought up by"
                - link "LSST" [ref=e121] [cursor=pointer]:
                  - /url: https://www.lsst.org/about
                - text: .
            - paragraph [ref=e122]:
              - text: The
              - code [ref=e123]: hats-import
              - text: package provides purpose-built map-reduce pipelines for converting large or custom catalogs into HATS format.
