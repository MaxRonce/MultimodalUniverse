                    - text: If you’re writing to cloud storage, or otherwise have some filesystem credential dict, initialize
                    - code [ref=e332]: output_path
                    - text: using
                    - code [ref=e333]: universal_pathlib
                    - text: ’s utilities.
                  - paragraph [ref=e334]: "In addition, you can specify directories to use for various intermediate files:"
                  - list [ref=e335]:
                    - listitem [ref=e336]:
                      - paragraph [ref=e337]:
                        - text: dask worker space (
                        - code [ref=e338]: dask_tmp
                        - text: )
