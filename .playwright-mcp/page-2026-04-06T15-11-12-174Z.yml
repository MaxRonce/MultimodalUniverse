                        - text: intermediate resume files (
                        - code [ref=e344]: resume_tmp
                        - text: )
                  - paragraph [ref=e345]:
                    - text: Most users are going to be ok with simply setting the
                    - code [ref=e346]: tmp_dir
                    - text: for all intermediate file use. For more information on these parameters, when you would use each, and demonstrations of temporary file use see
                    - link "Temporary files and disk usage" [ref=e347] [cursor=pointer]:
                      - /url: temp_files.html
                - generic [ref=e348]:
                  - heading "How to write the parquet files?" [level=3] [ref=e349]
                  - paragraph [ref=e350]: You may want to tweak parameters of the final catalog output, and we have helper arguments for a few of those.
