          - article [ref=e100]:
            - generic [ref=e101]:
              - heading "Catalog Import Arguments" [level=1] [ref=e102]
              - paragraph [ref=e103]: This page discusses a few topics around setting up a catalog pipeline.
              - paragraph [ref=e104]:
                - text: Once your catalog has been imported, you can verify and inspect the metadata, either with the
                - link "Verification Pipeline" [ref=e105] [cursor=pointer]:
                  - /url: ../guide/verification.html
                - text: ", or methods described in the"
                - link "Manual catalog verification notebook" [ref=e106] [cursor=pointer]:
                  - /url: https://docs.lsdb.io/en/stable/tutorials/pre_executed/manual_verification.html
              - paragraph [ref=e107]: "At a minimum, you need arguments that include where to find the input files, the column names for RA, and DEC, and where to put the output files. A minimal arguments block will look something like:"
              - generic [ref=e109]:
                - generic [ref=e110]: from hats_import.catalog.arguments import ImportArguments args = ImportArguments( sort_columns="ObjectID", ra_column="ObjectRA", dec_column="ObjectDec", input_path="./my_data", file_reader="csv", output_artifact_name="test_cat", output_path="./output", )
                - button "Copy to clipboard" [ref=e111] [cursor=pointer]:
                  - img "Copy to clipboard" [ref=e112]
              - paragraph [ref=e116]: More details on each of these parameters is provided in sections below.
              - paragraph [ref=e117]:
                - text: For the curious, see the API documentation for
                - link "hats_import.catalog.arguments.ImportArguments" [ref=e118] [cursor=pointer]:
                  - /url: ../reference/api/hats_import.ImportArguments.html#hats_import.ImportArguments
                  - code [ref=e119]: hats_import.catalog.arguments.ImportArguments
                - text: .
              - generic [ref=e120]:
                - heading "Pipeline setup" [level=2] [ref=e121]
                - generic [ref=e122]:
                  - heading "Dask" [level=3] [ref=e123]
                  - paragraph [ref=e124]:
                    - text: We will either use a user-provided dask
                    - code [ref=e125]: Client
                    - text: ", or create a new one with arguments:"
                  - paragraph [ref=e126]:
                    - code [ref=e127]: dask_tmp
                    - text: "-"
                    - code [ref=e128]: str
                    - text: "- directory for dask worker space. this should be local to the execution of the pipeline, for speed of reads and writes. For much more information, see"
                    - link "Temporary files and disk usage" [ref=e129] [cursor=pointer]:
                      - /url: temp_files.html
                    - text: .
                  - paragraph [ref=e130]:
                    - code [ref=e131]: dask_n_workers
                    - text: "-"
                    - code [ref=e132]: int
                    - text: "- number of workers for the dask client. Defaults to 1."
                  - paragraph [ref=e133]:
                    - code [ref=e134]: dask_threads_per_worker
                    - text: "-"
                    - code [ref=e135]: int
                    - text: "- number of threads per dask worker. Defaults to 1."
                  - paragraph [ref=e136]: "If you find that you need additional parameters for your dask client (e.g are creating a SLURM worker pool), you can instead create your own dask client and pass along to the pipeline, ignoring the above arguments. This would look like:"
                  - generic [ref=e138]:
                    - generic [ref=e139]: "from dask.distributed import Client from hats_import.pipeline import pipeline_with_client args = ... # ImportArguments() with Client('scheduler:port') as client: pipeline_with_client(args, client)"
                    - button "Copy to clipboard" [ref=e140] [cursor=pointer]:
                      - img "Copy to clipboard" [ref=e141]
                  - paragraph [ref=e145]:
                    - text: If you’re running within a
                    - code [ref=e146]: .py
                    - text: file, we recommend you use a
                    - code [ref=e147]: main
                    - text: "guard to potentially avoid some python threading issues with dask:"
                  - generic [ref=e149]:
                    - generic [ref=e150]: "from hats_import.pipeline import pipeline def import_pipeline(): args = ... pipeline(args) if __name__ == '__main__': import_pipeline()"
                    - button "Copy to clipboard" [ref=e151] [cursor=pointer]:
                      - img "Copy to clipboard" [ref=e152]
                - generic [ref=e156]:
                  - heading "Resuming" [level=3] [ref=e157]
                  - paragraph [ref=e158]: The import pipeline has the potential to be a very long-running process, if you’re importing large amounts of data, or performing complex transformations on the data before writing.
                  - paragraph [ref=e159]: While the pipeline runs, we take notes of our progress so that the pipeline can be resumed at a later time, if the job is pre-empted or canceled for any reason.
                  - paragraph [ref=e160]:
                    - text: When instantiating a pipeline, you can use the
                    - code [ref=e161]: resume
                    - text: flag to indicate that we can resume from an earlier execution of the pipeline. By default, if any resume files are found, we will restore the pipeline’s previous progress.
                  - paragraph [ref=e162]:
                    - text: If you want to start the pipeline from scratch you can simply set
                    - code [ref=e163]: resume=False
                    - text: . Alternatively, go to the temp directory you’ve specified and remove any intermediate files created by the previous runs of the
                    - code [ref=e164]: hats-import
                    - text: pipeline. You should also remove the output directory if it has any content. The resume argument performs these cleaning operations automatically for you.
                  - paragraph [ref=e165]:
                    - text: For more information about the kinds of files we write to enable this feature, see
                    - link "Temporary files and disk usage" [ref=e166] [cursor=pointer]:
                      - /url: temp_files.html
                    - text: .
                  - paragraph [ref=e167]: "By default, these notes files, and the intermediate parquet leaf files are removed once they’re no longer needed by the pipeline. If, for whatever reason, you would like to retain these files, you can use flags:"
                  - list [ref=e168]:
                    - listitem [ref=e169]:
                      - paragraph [ref=e170]:
                        - code [ref=e171]: delete_resume_log_files=False
                        - text: will keep resume notes/logs files
                    - listitem [ref=e172]:
                      - paragraph [ref=e173]:
                        - code [ref=e174]: delete_intermediate_parquet_files=False
                        - text: will retain ALL of the intermediate parquet leaf files.
              - generic [ref=e175]:
                - heading "Reading input files" [level=2] [ref=e176]
                - paragraph [ref=e177]: Catalog import reads through a list of files and converts them into a hats-sharded catalog.
                - paragraph [ref=e178]:
                  - text: If you already know the size of your catalog, and would like us to verify that the same number of rows exists at each checkpoint in the pipeline, pass
                  - code [ref=e179]: expected_total_rows=<int>
                  - text: .
                - generic [ref=e180]:
                  - heading "Which files?" [level=3] [ref=e181]
                  - paragraph [ref=e182]: "There are a few ways to specify the files to read:"
                  - list [ref=e183]:
                    - listitem [ref=e184]:
                      - generic [ref=e185]:
                        - term [ref=e186]:
                          - code [ref=e187]: input_path
                          - text: ":"
                        - definition [ref=e188]:
                          - paragraph [ref=e189]: will include all files in the indicated directory.
                    - listitem [ref=e190]:
                      - generic [ref=e191]:
                        - term [ref=e192]:
                          - code [ref=e193]: input_file_list
                          - text: ":"
                        - definition [ref=e194]:
                          - paragraph [ref=e195]: a list of fully-specified paths you want to read.
                          - list [ref=e196]:
                            - listitem [ref=e197]:
                              - paragraph [ref=e198]: this strategy can be useful to first run the import on a single input file and validate the input, then run again on the full input set, or to debug a single input file with odd behavior.
                            - listitem [ref=e199]:
                              - paragraph [ref=e200]: "if you have a mix of files in your target directory, you can use a glob statement like the following to gather input files:"
                  - generic [ref=e202]:
                    - generic [ref=e203]: in_file_paths = glob.glob("/data/object_and_source/object**.csv") in_file_paths.sort()
                    - button "Copy to clipboard" [ref=e204] [cursor=pointer]:
                      - img "Copy to clipboard" [ref=e205]
                  - generic [ref=e209]:
                    - paragraph [ref=e210]: Important 
                    - paragraph [ref=e211]:
                      - text: We will create one Dask task per element inside the
                      - code [ref=e212]: input_file_list
                      - text: .
                    - paragraph [ref=e213]: If you have only one large file, we can only read the file with one Dask worker. If you have lots of files, you might want to consider the Indexed batching strategy described below.
                - generic [ref=e214]:
                  - heading "How to read them?" [level=3] [ref=e215]
                  - paragraph [ref=e216]:
                    - text: Specify an instance of
                    - code [ref=e217]: InputReader
                    - text: for the
                    - code [ref=e218]: file_reader
                    - text: parameter.
                  - paragraph [ref=e219]:
                    - text: We use the
                    - code [ref=e220]: InputReader
                    - text: class to read files in chunks and pass the chunks along to the map/reduce stages. We’ve provided reference implementations for reading CSV, FITS, and Parquet input files, but you can subclass the reader type to suit whatever input files you’ve got.
                  - paragraph [ref=e221]:
                    - text: You only need to provide an object
                    - code [ref=e222]: file_reader
                    - text: argument if you are using a custom file reader or passing parameters to the file reader. For example you might use
                    - code [ref=e223]: file_reader=CsvReader(sep="\s+")
                    - text: to parse a whitespace separated file. Otherwise, you can use a short string to specify an existing file reader type e.g.
                    - code [ref=e224]: file_reader="csv"
                    - text: .
                  - paragraph [ref=e225]:
                    - text: You can find the full API documentation for
                    - link "hats_import.catalog.file_readers.InputReader" [ref=e226] [cursor=pointer]:
                      - /url: ../reference/api/hats_import.catalog.file_readers.InputReader.html#hats_import.catalog.file_readers.InputReader
                      - code [ref=e227]: hats_import.catalog.file_readers.InputReader
                  - generic [ref=e229]:
                    - generic [ref=e230]: "class StarrReader(InputReader): \"\"\"Class for fictional Starr file format.\"\"\" def __init__(self, chunksize=500_000, **kwargs): self.chunksize = chunksize self.kwargs = kwargs def read(self, input_file): starr_file = starr_io.read_table(input_file, **self.kwargs) for smaller_table in starr_file.to_batches(max_chunksize=self.chunksize): smaller_table = filter_nonsense(smaller_table) yield smaller_table.to_pandas() ... args = ImportArguments( ... ## Locates files like \"/directory/to/files/**starr\" input_path=\"/directory/to/files/\", ## NB - you need the parens here! file_reader=StarrReader(), )"
                    - button "Copy to clipboard" [ref=e231] [cursor=pointer]:
                      - img "Copy to clipboard" [ref=e232]
                  - paragraph [ref=e236]:
                    - text: If you’re reading from cloud storage, or otherwise have some filesystem credential dict, initialize
                    - code [ref=e237]: input_file
                    - text: using
                    - code [ref=e238]: universal_pathlib
                    - text: ’s utilities.
                - generic [ref=e239]:
                  - heading "Indexed batching strategy" [level=3] [ref=e240]
                  - paragraph [ref=e241]: If you have many small files (think 400k+ CSV files with a few rows each), you may benefit from “indexed” file readers. These allow you to explicitly create batches for tasks by providing a set of index files, where each file is a text file that contains only paths to data files.
                  - paragraph [ref=e242]: "Benefits:"
                  - list [ref=e243]:
                    - listitem [ref=e244]:
                      - paragraph [ref=e245]: If you have 400k+ input files, you don’t want to create 400k+ dask tasks to process these files.
                    - listitem [ref=e246]:
                      - paragraph [ref=e247]:
                        - text: If the files are very small, batching them in this way allows the import process to
                        - emphasis [ref=e248]: combine
                        - text: several small files into a single chunk for processing. This will result in fewer intermediate files during the
                        - code [ref=e249]: splitting
                        - text: stage.
                    - listitem [ref=e250]:
                      - paragraph [ref=e251]: If you have parquet files over a slow networked file system, we support pyarrow’s readahead protocol through indexed readers.
                  - paragraph [ref=e252]: "Warnings:"
                  - list [ref=e253]:
                    - listitem [ref=e254]:
                      - paragraph [ref=e255]: "If you have 20 dask workers in your pool, you may be tempted to create 20 index files. This is not always an efficient use of resources! You’d be better served by 200 index files, so that:"
                      - list [ref=e256]:
                        - listitem [ref=e257]:
                          - paragraph [ref=e258]: dask can spread the load if some lists of files take longer to process than others
                        - listitem [ref=e259]:
                          - paragraph [ref=e260]: if the pipeline dies after successfully processing 15 lists, when you retry the pipeline, you’ll only be processing 5 lists with those same 20 workers and many workers will be sitting idle.
                - generic [ref=e261]:
                  - heading "Which fields?" [level=3] [ref=e262]
                  - paragraph [ref=e263]:
                    - text: Specify the
                    - code [ref=e264]: ra_column
                    - text: and
                    - code [ref=e265]: dec_column
                    - text: for the dataset.
                  - paragraph [ref=e266]: There are two fields that we require in order to make a valid hats-sharded catalog, the right ascension and declination. At this time, this is the only supported system for celestial coordinates.
                  - paragraph [ref=e267]:
                    - text: If you’re importing data that has previously been hats-sharded, you may use
                    - code [ref=e268]: use_healpix_29 = True
                    - text: . This will use that previously computed hats spatial index as the position, instead of ra/dec.
              - generic [ref=e269]:
                - heading "Healpix order and thresholds" [level=2] [ref=e270]
                - paragraph [ref=e271]: When creating a new catalog through the hats-import process, we try to create partitions with approximately the same number of rows per partition. This isn’t perfect, because the sky is uneven, but we still try to create smaller-area pixels in more dense areas, and larger-area pixels in less dense areas.
                - paragraph [ref=e272]:
                  - text: We use the argument
                  - code [ref=e273]: pixel_threshold
                  - text: and will split a partition into smaller healpix pixels until the number of rows is smaller than
                  - code [ref=e274]: pixel_threshold
                  - text: . We will only split by healpix pixels up to the
                  - code [ref=e275]: highest_healpix_order
                  - text: . If we would need to split further, we’ll throw an error at the “Binning” stage, and you should adjust your parameters.
                - paragraph [ref=e276]:
                  - text: For more discussion of the
                  - code [ref=e277]: pixel_threshold
                  - text: argument and a strategy for setting this parameter, see notebook
                  - link "Estimate pixel threshold" [ref=e278] [cursor=pointer]:
                    - /url: ../notebooks/estimate_pixel_threshold.html
                - paragraph [ref=e279]:
                  - text: For more discussion of the “Binning” and all other stages, see
                  - link "Temporary files and disk usage" [ref=e280] [cursor=pointer]:
                    - /url: temp_files.html
                  - text: .
                - generic [ref=e281]:
                  - heading "Sparse Datasets" [level=3] [ref=e282]
                  - paragraph [ref=e283]: For sparse datasets you might want to force your catalog partitioning to avoid partitions with very large area on they sky.
                  - paragraph [ref=e284]: Why? If you have sparse data that you know you will want to cross-match or join to a catalog that is much denser, you may find yourself trying to match a large (in terms of area on the sky) pixel to thousands of smaller pixels in the denser catalog that occupy the same large region in the sky. Using more pixels of higher order will have some inefficiencies in terms of on-disk storage, but will be easier to compute joins and cross-matches to large datasets.
                  - paragraph [ref=e285]: "There are a few strategies for tweaking the partitioning:"
                  - list [ref=e286]:
                    - listitem [ref=e287]:
                      - paragraph [ref=e288]:
                        - strong [ref=e289]: order range
                        - text: "- use the"
                        - code [ref=e290]: lowest_healpix_order
                        - text: argument, in addition to the
                        - code [ref=e291]: highest_healpix_order
                        - text: .
                    - listitem [ref=e292]:
                      - paragraph [ref=e293]:
                        - strong [ref=e294]: constant order
                        - text: "- use the"
                        - code [ref=e295]: constant_healpix_order
                        - text: argument. This will
                        - strong [ref=e296]: ignore
                        - text: the
                        - code [ref=e297]: pixel_threshold
                        - text: ","
                        - code [ref=e298]: highest_healpix_order
                        - text: ", and"
                        - code [ref=e299]: lowest_healpix_order
                        - text: arguments and the catalog will be partitioned by healpix pixels at the
                        - code [ref=e300]: constant_healpix_order
                        - text: .
                    - listitem [ref=e301]:
                      - paragraph [ref=e302]:
                        - strong [ref=e303]: drop empty siblings
                        - text: "- by default, the"
                        - code [ref=e304]: drop_empty_siblings
                        - text: flag is set to
                        - code [ref=e305]: "True"
                        - text: ", and will try to use smaller area pixels in sparse regions of the sky. This can make the catalog footprint closer to the actual survey footprint, but can be disabled if desired."
              - generic [ref=e306]:
                - heading "Progress Reporting" [level=2] [ref=e307]
                - paragraph [ref=e308]:
                  - text: By default, we will display some progress bars during pipeline execution. To disable these (e.g. when you expect no output to standard out), you can set
                  - code [ref=e309]: progress_bar=False
                  - text: .
                - paragraph [ref=e310]: "There are several stages to the pipeline execution, and you can expect progress reporting to look like the following:"
                - generic [ref=e313]: "Mapping : 100%|██████████| 72/72 [58:55:18<00:00, 2946.09s/it] Binning : 100%|██████████| 1/1 [01:15<00:00, 75.16s/it] Splitting: 100%|██████████| 72/72 [72:50:03<00:00, 3641.71s/it] Reducing : 100%|██████████| 10895/10895 [7:46:07<00:00, 2.57s/it] Finishing: 100%|██████████| 6/6 [08:03<00:00, 80.65s/it]"
                - paragraph [ref=e314]:
                  - text: We use
                  - code [ref=e315]: tqdm
                  - text: to render these beautiful progress bars.
                  - code [ref=e316]: tqdm
                  - text: "will try to make a guess about the type of output to provide: plain text as for a command line, or a pretty ipywidget. If it tries to use a pretty widget but your execution environment can’t support the widget, you can force the pipeline to use a simple progress bar with the"
                  - code [ref=e317]: simple_progress_bar
                  - text: argument. If you want to configure the progress bar any further, pass values to the
                  - code [ref=e318]: tqdm_kwargs
                  - text: parameter. You can find more details on available arguments at
                  - link "the tqdm documentation" [ref=e319] [cursor=pointer]:
                    - /url: https://tqdm.github.io/docs/tqdm/
                  - text: .
                - paragraph [ref=e320]:
                  - text: For very long-running pipelines (e.g. multi-TB inputs), you can get an email notification when the pipeline completes using the
                  - code [ref=e321]: completion_email_address
                  - text: argument. This will send a brief email, for either pipeline success or failure.
              - generic [ref=e322]:
                - heading "Output" [level=2] [ref=e323]
                - generic [ref=e324]:
                  - heading "Where?" [level=3] [ref=e325]
                  - paragraph [ref=e326]:
                    - text: You must specify a name for the catalog, using
                    - code [ref=e327]: output_artifact_name
                    - text: .
                  - paragraph [ref=e328]:
                    - text: You must specify where you want your catalog data to be written, using
