          - article [ref=e134]:
            - generic [ref=e135]:
              - heading "File Readers" [level=1] [ref=e136]
              - paragraph [ref=e137]:
                - text: In the catalog import pipeline, we use
                - code [ref=e138]: InputReader
                - text: objects to iterate through the input files. This allows us to take in a variety of file formats, without having to re-write the entire processing pipeline for each kind of file format we encounter.
              - generic [ref=e139]:
                - heading "Your own read method" [level=2] [ref=e140]
                - paragraph [ref=e141]:
                  - text: If you need to write your own input file reader, it should subclass
                  - code [ref=e142]: InputReader
                  - text: and must provide a
                  - code [ref=e143]: read
                  - text: method.
                - paragraph [ref=e144]:
                  - text: On the first pass through the data, we just need to read the RA and Dec columns, and so the
                  - code [ref=e145]: read_columns
                  - text: value will be a list with just these two columns. You can use this information to read less data, if possible given the file format.
                - paragraph [ref=e146]:
                  - text: You can either yield a
                  - code [ref=e147]: pandas.DataFrame
                  - text: object or a
                  - code [ref=e148]: pyarrow.Table
                  - text: . If yield a pandas dataframe, note that further pipeline stages will convert into a
                  - code [ref=e149]: pyarrow.Table
                  - text: anyway.
                - paragraph [ref=e150]: You must yield the result, and should utlize chunking to avoid memory issues.
              - generic [ref=e151]:
                - heading "Index Readers" [level=2] [ref=e152]
                - paragraph [ref=e153]: If you have many small files (think 400k+ CSV files with a few rows each), you may benefit from “index” file readers. These allow you to explicitly create batches for tasks by providing a set of index files, where each file is a text file that contains only paths to data files.
                - paragraph [ref=e154]: "Benefits:"
                - list [ref=e155]:
                  - listitem [ref=e156]:
                    - paragraph [ref=e157]: If you have 400k+ input files, you don’t want to create 400k+ dask tasks to process these files.
                  - listitem [ref=e158]:
                    - paragraph [ref=e159]:
                      - text: If the files are very small, batching them in this way allows the import process to
                      - emphasis [ref=e160]: combine
                      - text: several small files into a single chunk for processing. This will result in fewer intermediate files during the
                      - code [ref=e161]: splitting
                      - text: stage.
                  - listitem [ref=e162]:
                    - paragraph [ref=e163]: If you have parquet files over a slow networked file system, we support pyarrow’s readahead protocol through index readers.
                - paragraph [ref=e164]: "Warnings:"
                - list [ref=e165]:
                  - listitem [ref=e166]:
                    - paragraph [ref=e167]: "If you have 20 dask workers in your pool, you may be tempted to create 20 index files. This is not always an efficient use of resources! You’d be better served by 200 index files, so that:"
                    - list [ref=e168]:
                      - listitem [ref=e169]:
                        - paragraph [ref=e170]: dask can spread the load if some lists of files take longer to process than others
                      - listitem [ref=e171]:
                        - paragraph [ref=e172]: if the pipeline dies after successfully processing 15 lists, when you retry the pipeline, you’ll only be processing 5 lists with those same 20 workers and many workers will be sitting idle.
                - paragraph [ref=e173]:
                  - text: The
                  - code [ref=e174]: read_index_file
                  - text: method is provided as a convenience to read these index files, and returns a list of paths to be read by your method.
                - generic [ref=e176]:
                  - generic [ref=e177]: "def read(self, input_file, read_columns=None): file_paths = self.read_index_file( input_file=input_file, upath_kwargs=self.upath_kwargs, **self.kwargs )"
                  - button "Copy to clipboard" [ref=e178] [cursor=pointer]:
                    - img "Copy to clipboard" [ref=e179]
              - generic [ref=e183]:
                - heading "Pandas vs Pyarrow" [level=2] [ref=e184]
                - paragraph [ref=e185]:
                  - text: The
                  - code [ref=e186]: read
                  - text: method can either yield a
                  - code [ref=e187]: pandas.DataFrame
                  - text: object or a
                  - code [ref=e188]: pyarrow.Table
                  - text: . If yielding a pandas dataframe, note that further pipeline stages will convert into a
                  - code [ref=e189]: pyarrow.Table
                  - text: anyway.
                - paragraph [ref=e190]: We provide alternative implementations of some common readers that will use pyarrow file readers. This can be faster, as it avoids unneccessary conversion between table formats, but you may encounter rougher edges.
              - generic [ref=e191]:
                - heading "Iterate by Row Groups" [level=2] [ref=e192]
                - paragraph [ref=e193]:
                  - text: For Parquet files, both the
                  - code [ref=e194]: ParquetPandasReader
                  - text: and
                  - code [ref=e195]: ParquetPyarrowReader
                  - text: support reading by row groups, rather than by chunks of rows. This can be more efficient if your Parquet files are already organized into row groups that are suitable for your processing.
                - paragraph [ref=e196]:
                  - text: To enable this, set the
                  - code [ref=e197]: iterate_by_row_groups
                  - text: parameter to
                  - code [ref=e198]: "True"
                  - text: when instantiating the reader. Then, when you call the
                  - code [ref=e199]: read
                  - text: method, it will yield dataframes or tables corresponding to each row group in the Parquet file.
                - generic [ref=e201]:
                  - generic [ref=e202]: args = ImportArguments( file_reader=ParquetPyarrowReader(iterate_by_row_groups=True), ... )
                  - button "Copy to clipboard" [ref=e203] [cursor=pointer]:
                    - img "Copy to clipboard" [ref=e204]
