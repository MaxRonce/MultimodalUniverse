# Configuration for the HATS conversion Snakefile.
# Override on the command line: `snakemake --config fiducial_healpix=1177 n_rows=2000`

# Healpix tile to convert (must exist for the datasets you want to build).
fiducial_healpix: 1177

# Cap on rows per HDF5 tile (for fast prototyping). Set to a large number for full builds.
n_rows: 2000

# Where the HATS catalogs land. Must be writable.
hats_root: /mnt/ceph/users/polymathic/MultimodalUniverse_v2_hats
